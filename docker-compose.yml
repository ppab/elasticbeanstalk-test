services:
  web:
    build: ./web
    expose:
      - "5000"

  api:
    build: ./api
    expose:
      - "3001"
    environment:
      - FLASK_URL=http://web:5000
      - SERVICE2_URL=http://service2:3002
    depends_on:
      - web
      - service2

  service2:
    build: ./service2
    expose:
      - "3002"
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  front:
    build: ./front
    expose:
      - "80"
    environment:
      - REACT_APP_API_URL=

  nginx-proxy:
    build: ./proxy
    ports:
      - "80:80"
    volumes:
      - "/var/log/nginx:/var/log/nginx"
    depends_on:
      - web
      - api
      - front

volumes:
  redis_data:
